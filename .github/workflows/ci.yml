name: Validate app

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --include=dev --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
