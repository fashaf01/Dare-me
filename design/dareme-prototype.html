<title>Dareme</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Figtree:wght@400;500;600;700;800&family=Unbounded:wght@500;700;800&display=swap">
<style>
/* Layout: phone-first app shell. On wide screens the app sits in a device frame beside a short brief. */
:root{
  --stage:#E8E4EE; --stage-dot:#D6D0DF;
  --bg:#F7F5FA; --surface:#FFFFFF; --surface-2:#F0EDF4; --surface-3:#E3DFE9;
  --ink:#16131C; --ink-2:#5D5767; --ink-3:#857F8F; --line:#E5E1EB;
  --dare:#E8164F; --dare-fg:#D3104A; --dare-2:#FF7A45; --dare-soft:#FFE4EB; --on-dare:#FFFFFF;
  --sticker:#FFD43B; --on-sticker:#1F1800;
  --safe:#087F64; --safe-soft:#DDF3EC;
  --on-tile:#FFFFFF; --knob:#FFFFFF; --frame:#141118; --scrim:rgba(14,11,18,.48);
  --shadow:0 1px 2px rgba(22,19,28,.06),0 10px 28px rgba(22,19,28,.09);
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --gut-l:max(16px, env(safe-area-inset-left, 0px));
  --gut-r:max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --stage:#07060A; --stage-dot:#17141D;
    --bg:#0F0D13; --surface:#18151E; --surface-2:#221E29; --surface-3:#2E2936;
    --ink:#F5F2F8; --ink-2:#ACA5B7; --ink-3:#7F788A; --line:#29242F;
    --dare:#E8164F; --dare-fg:#FF6B90; --dare-2:#FF8A57; --dare-soft:#3A1522; --on-dare:#FFFFFF;
    --sticker:#FFD84A; --on-sticker:#1F1800;
    --safe:#3DD3A8; --safe-soft:#0F2A22;
    --on-tile:#FFFFFF; --knob:#FFFFFF; --frame:#000000; --scrim:rgba(0,0,0,.6);
    --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 28px rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --stage:#07060A; --stage-dot:#17141D;
  --bg:#0F0D13; --surface:#18151E; --surface-2:#221E29; --surface-3:#2E2936;
  --ink:#F5F2F8; --ink-2:#ACA5B7; --ink-3:#7F788A; --line:#29242F;
  --dare:#E8164F; --dare-fg:#FF6B90; --dare-2:#FF8A57; --dare-soft:#3A1522; --on-dare:#FFFFFF;
  --sticker:#FFD84A; --on-sticker:#1F1800;
  --safe:#3DD3A8; --safe-soft:#0F2A22;
  --on-tile:#FFFFFF; --knob:#FFFFFF; --frame:#000000; --scrim:rgba(0,0,0,.6);
  --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 28px rgba(0,0,0,.4);
  color-scheme:dark;
}

html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;background:var(--bg);color:var(--ink);font:15px/1.4 var(--f-body);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit;-webkit-tap-highlight-color:transparent}
input,textarea,select{font:inherit;color:inherit}
h1,h2,h3,h4,p{margin:0}
ul,ol{margin:0;padding:0}
img{display:block}
:focus-visible{outline:2.5px solid var(--dare-fg);outline-offset:2px;border-radius:8px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- icons */
.i{width:24px;height:24px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.i.fill{fill:currentColor}

/* ---------- stage + device */
.stage{height:100%;display:flex;justify-content:center;align-items:stretch}
.brief{display:none}
.device{position:relative;width:100%;height:100%;display:flex}
.app{position:relative;flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
.statusbar{display:none}

@media (min-width:760px) and (min-height:640px){
  body{background:var(--stage) radial-gradient(var(--stage-dot) 1.2px, transparent 1.6px) 0 0/22px 22px}
  .stage{align-items:center;gap:64px;padding-block:24px;padding-left:var(--gut-l);padding-right:var(--gut-r)}
  .device{flex:none;width:402px;height:min(864px,100%);padding:11px;border-radius:56px;background:var(--frame);box-shadow:0 0 0 1.5px rgba(255,255,255,.06) inset,0 30px 80px rgba(20,12,30,.28),0 8px 20px rgba(20,12,30,.18)}
  .app{border-radius:45px}
  .statusbar{display:flex;position:relative;flex:none;height:48px;align-items:center;justify-content:space-between;padding:4px 32px 0 36px;font-weight:700;font-size:15px;color:var(--ink);background:var(--bg)}
  .island{position:absolute;left:50%;top:11px;transform:translateX(-50%);width:116px;height:33px;border-radius:20px;background:var(--frame)}
  .sb-icons{display:flex;align-items:center;gap:6px}
  .sb-icons svg{display:block;fill:currentColor}
}
@media (min-width:1100px) and (min-height:640px){
  .brief{display:flex;flex-direction:column;gap:28px;width:340px;flex:none}
}

/* ---------- brief panel */
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--dare-fg)}
.brief-title{font:800 64px/0.95 var(--f-display);letter-spacing:-.05em;margin-top:10px}
.brief-title span,.wordmark span{display:inline-block;margin-left:.06em;padding:.06em .2em .1em;background:var(--sticker);color:var(--on-sticker);border-radius:.22em;transform:rotate(-5deg) translateY(-.04em);font-size:.78em;letter-spacing:-.03em}
.brief-lede{font-size:18px;line-height:1.45;color:var(--ink-2);margin-top:14px;max-width:30ch;text-wrap:pretty}
.brief h2{font:700 13px/1 var(--f-display);letter-spacing:.04em;text-transform:uppercase;margin-bottom:14px}
.brief-steps{list-style:none;display:flex;flex-direction:column;gap:10px;counter-reset:s}
.brief-steps li{counter-increment:s;display:flex;gap:12px;align-items:baseline;color:var(--ink-2);line-height:1.4}
.brief-steps li::before{content:counter(s);flex:none;display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--bg);font:700 11px/1 var(--f-display);transform:translateY(5px)}
.brief-steps b{color:var(--ink)}
.brief-safe{list-style:none;display:grid;gap:10px}
.brief-safe li{display:flex;gap:10px;align-items:center;color:var(--ink-2)}
.brief-safe .i{width:20px;height:20px;color:var(--safe)}

/* ---------- views */
.views{position:relative;flex:1;min-height:0}
.view{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-width:none;padding-bottom:24px}
.view::-webkit-scrollbar,.rings::-webkit-scrollbar,.chips::-webkit-scrollbar,.badges::-webkit-scrollbar,.page-scroll::-webkit-scrollbar,.msgs::-webkit-scrollbar,.sheet-scroll::-webkit-scrollbar{display:none}
.pad{padding-left:var(--gut-l);padding-right:var(--gut-r)}

.bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;padding-left:var(--gut-l);padding-right:calc(var(--gut-r) - 8px);background:var(--bg);background:color-mix(in srgb,var(--bg) 86%,transparent);-webkit-backdrop-filter:saturate(1.6) blur(16px);backdrop-filter:saturate(1.6) blur(16px)}
.bar-actions{display:flex;align-items:center;gap:2px}
.wordmark{font:800 25px/1 var(--f-display);letter-spacing:-.05em}
.title{font:700 24px/1 var(--f-display);letter-spacing:-.03em}
.handle{display:flex;align-items:center;gap:6px;font:700 18px/1 var(--f-display);letter-spacing:-.02em}
.handle .i{width:18px;height:18px}
.icon-btn{position:relative;display:grid;place-items:center;width:42px;height:42px;border-radius:50%;flex:none}
.icon-btn:active{background:var(--surface-2)}
.icon-btn.sm{width:36px;height:36px}
.icon-btn.sm .i{width:20px;height:20px}
.dot{position:absolute;top:8px;right:9px;width:9px;height:9px;border-radius:50%;background:var(--dare);box-shadow:0 0 0 2px var(--bg)}

.label{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin:22px 0 10px}

/* ---------- buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 20px;border-radius:16px;font-weight:800;font-size:15.5px;white-space:nowrap;width:100%;transition:transform .12s ease,opacity .2s}
.btn .i{width:20px;height:20px;stroke-width:2.1}
.btn.primary{background:var(--dare);color:var(--on-dare)}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.outline{border:1.5px solid var(--line);color:var(--ink)}
.btn.danger{background:var(--dare-soft);color:var(--dare-fg)}
.btn.sm{min-height:38px;font-size:14px;padding:0 14px;border-radius:12px;width:auto}
.btn.sm .i{width:18px;height:18px}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.link{color:var(--dare-fg);font-weight:800;text-decoration:underline;text-underline-offset:3px}

/* ---------- tile + avatar */
.tile{width:var(--s);height:var(--s);flex:none;display:grid;place-items:center;border-radius:calc(var(--s)*.32);background:linear-gradient(140deg,var(--a),var(--b));color:var(--fg,var(--on-tile))}
.tile .i{width:calc(var(--s)*.52);height:calc(var(--s)*.52);stroke-width:2.1}
.av{width:var(--s);height:var(--s);flex:none;border-radius:50%;display:grid;place-items:center;background:linear-gradient(140deg,var(--a),var(--b));color:var(--on-tile);font:700 calc(var(--s)*.36)/1 var(--f-display);letter-spacing:-.03em}
.av.halo{box-shadow:0 0 0 3px var(--bg),0 0 0 5.5px var(--dare-2)}
.vbadge{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;background:var(--safe);color:var(--surface);flex:none;vertical-align:-2px}
.vbadge .i{width:10px;height:10px;stroke-width:3.4}

/* ---------- nerve meter */
.nerve{display:inline-flex;gap:2px;align-items:flex-end;height:11px;vertical-align:-1px}
.nerve i{width:4px;border-radius:1.5px;background:var(--surface-3)}
.nerve i:nth-child(1){height:5px}.nerve i:nth-child(2){height:8px}.nerve i:nth-child(3){height:11px}
.nerve[data-l="1"] i:nth-child(-n+1),.nerve[data-l="2"] i:nth-child(-n+2),.nerve[data-l="3"] i{background:var(--dare-fg)}
.hero-dare .nerve i{background:rgba(255,255,255,.35)}
.hero-dare .nerve[data-l="1"] i:nth-child(-n+1),.hero-dare .nerve[data-l="2"] i:nth-child(-n+2),.hero-dare .nerve[data-l="3"] i{background:currentColor}

/* ---------- home: today's dares row */
.rings{display:flex;gap:12px;overflow-x:auto;padding:6px var(--gut-r) 14px var(--gut-l);scrollbar-width:none;scroll-snap-type:x proximity}
.ring-item{display:flex;flex-direction:column;align-items:center;gap:6px;width:70px;flex:none;scroll-snap-align:start}
.ring{display:block;padding:3px;border-radius:50%;background:conic-gradient(from 200deg,var(--sticker),var(--dare-2),var(--dare),var(--sticker))}
.ring.seen{background:var(--surface-3)}
.ring .tile{border-radius:50%;box-shadow:0 0 0 3px var(--bg)}
.ring-streak{display:grid;place-items:center;width:64px;height:64px;border-radius:50%;background:var(--surface);border:1.5px dashed var(--surface-3);position:relative}
.ring-streak .i{width:28px;height:28px;color:var(--dare-fg);fill:var(--dare-soft)}
.ring-streak b{position:absolute;bottom:-4px;right:-2px;min-width:24px;height:24px;padding:0 6px;border-radius:12px;background:var(--ink);color:var(--bg);font:700 12px/24px var(--f-display);text-align:center;box-shadow:0 0 0 3px var(--bg)}
.ring-label{font-size:11.5px;font-weight:600;color:var(--ink-2);max-width:70px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- active dare ticket */
.ticket{margin:4px var(--gut-r) 16px var(--gut-l);padding:14px;border-radius:20px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:12px;
  -webkit-mask:radial-gradient(circle 10px at 0 71px,#0000 97%,#000) left/51% 100% no-repeat,radial-gradient(circle 10px at 100% 71px,#0000 97%,#000) right/51% 100% no-repeat;
          mask:radial-gradient(circle 10px at 0 71px,#0000 97%,#000) left/51% 100% no-repeat,radial-gradient(circle 10px at 100% 71px,#0000 97%,#000) right/51% 100% no-repeat}
.tk-top{display:flex;align-items:center;gap:12px;height:44px}
.tk-text{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.tk-k{font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--dare-fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tk-t{font:700 15.5px/1.15 var(--f-display);letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tk-time{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:800;color:var(--ink-2);background:var(--surface-2);padding:6px 9px;border-radius:999px;white-space:nowrap;font-variant-numeric:tabular-nums}
.tk-time .i{width:14px;height:14px;stroke-width:2.2}
.tk-perf{height:0;border-top:2px dashed var(--surface-3);margin:0 2px}
.tk-actions{display:flex;gap:8px}
.tk-actions .btn{flex:1}

/* ---------- feed */
.ftabs{display:flex;gap:24px;padding:0 var(--gut-r) 0 var(--gut-l);border-bottom:1px solid var(--line);margin-bottom:6px}
.ftab{padding:10px 0 11px;font-weight:800;font-size:15px;color:var(--ink-3);position:relative}
.ftab[aria-selected="true"]{color:var(--ink)}
.ftab[aria-selected="true"]::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;border-radius:3px;background:var(--ink)}
.feed{display:flex;flex-direction:column;gap:26px;padding-top:6px}
.post-head{display:flex;align-items:center;gap:8px;padding:6px calc(var(--gut-r) - 8px) 10px var(--gut-l)}
.post-who{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.who-text{display:flex;flex-direction:column;min-width:0;gap:1px}
.who-name{display:flex;align-items:center;gap:5px;font-weight:800;font-size:14.5px}
.who-meta{font-size:12.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.post-media{position:relative;background:var(--surface-2);overflow:hidden;-webkit-user-select:none;user-select:none;cursor:pointer;max-width:100%}
.post-media img{width:100%;height:100%;object-fit:cover}
.sticker{position:absolute;left:12px;top:12px;display:inline-flex;align-items:center;gap:7px;padding:6px 10px 6px 7px;background:var(--sticker);color:var(--on-sticker);border-radius:10px;transform:rotate(-3deg);box-shadow:0 6px 16px rgba(0,0,0,.22);max-width:calc(100% - 24px)}
.sticker .i{width:15px;height:15px;stroke-width:3}
.sticker span{font:700 10px/1 var(--f-display);letter-spacing:.08em;text-transform:uppercase}
.sticker b{font-weight:800;font-size:12.5px;line-height:1;padding-left:7px;border-left:1.5px solid rgba(31,24,0,.25);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.burst{position:absolute;inset:0;margin:auto;width:110px;height:110px;color:#fff;opacity:0;pointer-events:none;filter:drop-shadow(0 6px 18px rgba(0,0,0,.35))}
.burst .i{width:110px;height:110px;stroke:none}
.burst.go{animation:burst .85s cubic-bezier(.2,.9,.3,1.2)}
@keyframes burst{0%{opacity:0;transform:scale(.3)}25%{opacity:1;transform:scale(1.05)}55%{opacity:1;transform:scale(.95)}100%{opacity:0;transform:scale(1.1)}}
.post-actions{display:flex;align-items:center;gap:18px;padding:8px var(--gut-r) 2px var(--gut-l)}
.act{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:14px;min-height:40px;font-variant-numeric:tabular-nums}
.act .i{width:26px;height:26px}
.act.like.on{color:var(--dare)}
.act.like.on .i{fill:currentColor;animation:pop .35s ease}
.act.save.on .i{fill:currentColor}
@keyframes pop{40%{transform:scale(1.25)}}
.grow{flex:1}
.caption{padding:0 var(--gut-r) 0 var(--gut-l);font-size:14.5px;line-height:1.45;overflow-wrap:anywhere}
.caption b{font-weight:800;margin-right:5px}
.view-comments{display:block;padding:4px var(--gut-r) 0 var(--gut-l);color:var(--ink-3);font-size:14px;font-weight:500}
.try-wrap{padding:12px var(--gut-r) 0 var(--gut-l)}
.try{display:flex;align-items:center;gap:11px;width:100%;padding:8px 10px 8px 8px;background:var(--surface);border:1px solid var(--line);border-radius:16px}
.try-text{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.try-k{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--dare-fg)}
.try-t{font-weight:800;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.try-n{font-size:12px;color:var(--ink-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.try>.i{width:18px;height:18px;color:var(--ink-3)}
.feed-end{display:flex;flex-direction:column;align-items:center;gap:12px;padding:34px var(--gut-r) 12px var(--gut-l);color:var(--ink-2);text-align:center}
.feed-end .i{width:30px;height:30px;color:var(--safe)}
.empty{padding:40px var(--gut-r) 20px var(--gut-l);text-align:center;color:var(--ink-2);display:flex;flex-direction:column;align-items:center;gap:12px}

/* ---------- dares board */
.board-sub{padding:0 var(--gut-r) 12px var(--gut-l);color:var(--ink-2);font-size:13.5px}
.seg{display:flex;padding:4px;background:var(--surface-2);border-radius:14px}
.seg button{flex:1;padding:9px 4px;border-radius:10px;font-weight:800;font-size:13.5px;color:var(--ink-2);text-align:center}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg button:disabled{opacity:.4;cursor:not-allowed}
.seg-wrap{padding:0 var(--gut-r) 10px var(--gut-l)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px var(--gut-r) 14px var(--gut-l);scrollbar-width:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:700;font-size:13.5px;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.podium{padding:0 var(--gut-r) 0 var(--gut-l)}
.hero-dare{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:10px;width:100%;padding:18px;border-radius:24px;background:linear-gradient(140deg,var(--a),var(--b));color:var(--fg,var(--on-tile));text-align:left;isolation:isolate}
.hero-num{position:absolute;right:-6px;bottom:-34px;font:800 190px/1 var(--f-display);letter-spacing:-.08em;opacity:.17;z-index:-1;pointer-events:none}
.hero-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.hero-badge{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.22);font-weight:800;font-size:12px;letter-spacing:.02em}
.hero-badge .i{width:15px;height:15px}
.hero-icon{display:grid;place-items:center;width:52px;height:52px;border-radius:16px;background:rgba(255,255,255,.2)}
.hero-icon .i{width:28px;height:28px;stroke-width:2}
.hero-title{font:700 23px/1.1 var(--f-display);letter-spacing:-.03em;text-wrap:balance;margin-top:4px}
.hero-desc{font-size:14.5px;line-height:1.4;opacity:.92;max-width:34ch}
.hero-foot{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:4px;font-weight:700;font-size:13px}
.stack{display:flex}
.stack .av{box-shadow:0 0 0 2px rgba(255,255,255,.85)}
.stack .av+.av{margin-left:-8px}
.hero-meta{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:13px;opacity:.95}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.duo-card{display:flex;flex-direction:column;gap:9px;padding:14px;border-radius:20px;background:var(--surface);border:1px solid var(--line);min-width:0;text-align:left}
.duo-top{display:flex;align-items:flex-start;justify-content:space-between}
.duo-rank{font:800 28px/1 var(--f-display);letter-spacing:-.05em}
.duo-title{font-weight:800;font-size:15px;line-height:1.2;text-wrap:balance}
.duo-meta{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2)}
.duo-count{display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:auto}
.rank-list{list-style:none;margin-top:14px}
.rank-row{display:flex;align-items:center;gap:12px;width:100%;padding:9px var(--gut-r) 9px var(--gut-l)}
.rank-row:active{background:var(--surface-2)}
.rank-n{width:26px;flex:none;font:700 16px/1 var(--f-display);color:var(--ink-3);text-align:center;font-variant-numeric:tabular-nums}
.rr-text{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.rr-t{font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rr-m{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden}
.rr-m .i{width:14px;height:14px}
.rr-c{display:flex;flex-direction:column;align-items:flex-end;gap:3px;font-weight:800;font-size:14px;font-variant-numeric:tabular-nums}
.trend{display:inline-flex;align-items:center;gap:1px;font-size:11.5px;font-weight:800;color:var(--ink-3)}
.trend .i{width:13px;height:13px;stroke-width:2.8}
.trend.up{color:var(--safe)}
.trend.down{color:var(--dare-fg)}
.trend.new{padding:2px 6px;border-radius:6px;background:var(--sticker);color:var(--on-sticker);font-size:10px;letter-spacing:.06em}
.hero-dare .trend{color:inherit}
.hero-dare .trend.new{color:var(--on-sticker)}
.mode{display:inline-flex;align-items:center;gap:4px}
.mode .i{width:14px;height:14px}
.reviewed{display:flex;gap:12px;align-items:flex-start;margin:18px var(--gut-r) 0 var(--gut-l);padding:14px;border-radius:18px;background:var(--safe-soft);color:var(--ink)}
.reviewed>.i{color:var(--safe);margin-top:1px}
.reviewed p{font-size:13.5px;line-height:1.45;color:var(--ink-2)}
.reviewed b{color:var(--ink)}
.reviewed .link{display:inline-block;margin-top:6px;color:var(--safe)}

/* ---------- chats */
.note-card{display:flex;gap:12px;align-items:flex-start;padding:13px 14px;border-radius:18px;background:var(--safe-soft)}
.note-card>.i{color:var(--safe);margin-top:1px}
.note-card p{font-size:13.5px;line-height:1.45;color:var(--ink-2)}
.note-card b{color:var(--ink)}
.find-card{display:flex;align-items:center;gap:12px;width:100%;padding:14px;border-radius:20px;border:1.5px dashed var(--surface-3);background:var(--surface)}
.fc-text{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.find-card small{font-size:13px;color:var(--ink-2)}
.find-card>.i{color:var(--ink-3)}
.chat-row{display:flex;align-items:center;gap:12px;width:100%;padding:10px var(--gut-r) 10px var(--gut-l)}
.chat-row:active{background:var(--surface-2)}
.cr-text{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.cr-top{display:flex;justify-content:space-between;gap:8px}
.cr-top b{font-weight:800}
.cr-when{font-size:12.5px;color:var(--ink-3);white-space:nowrap}
.cr-dare{font-size:12.5px;font-weight:700;color:var(--dare-fg)}
.cr-dare.muted{color:var(--ink-3)}
.cr-last{font-size:13.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.unread{width:10px;height:10px;border-radius:50%;background:var(--dare);flex:none}

/* ---------- profile */
.me{padding:4px var(--gut-r) 0 var(--gut-l);display:flex;flex-direction:column;gap:14px}
.me-top{display:flex;align-items:center;gap:22px;padding:8px 0 0 6px}
.stats{flex:1;display:grid;grid-template-columns:repeat(3,1fr);text-align:center}
.stat b{display:block;font:700 19px/1.15 var(--f-display);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--ink-2)}
.me-name{font-weight:800;font-size:16px;display:flex;align-items:center;gap:6px}
.me-bio{color:var(--ink-2);font-size:14.5px;margin-top:2px;max-width:40ch}
.me-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.me-actions .btn{width:100%}
.streak{padding:14px;border-radius:20px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.streak-top{display:flex;align-items:center;gap:12px}
.streak-flame{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:var(--dare-soft);color:var(--dare-fg)}
.streak-flame .i{fill:currentColor;stroke:none}
.streak-top>div{flex:1;min-width:0;display:flex;flex-direction:column}
.streak-top b{font:700 15px/1.2 var(--f-display);letter-spacing:-.02em}
.streak-top span{font-size:13px;color:var(--ink-2)}
.pts{text-align:right;font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.pts b{display:block;font:700 16px/1.1 var(--f-display);color:var(--ink);font-variant-numeric:tabular-nums}
.week{list-style:none;display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.week li{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;font-weight:700;color:var(--ink-3)}
.week li::before{content:"";width:100%;max-width:34px;height:8px;border-radius:4px;background:var(--surface-3)}
.week li.on::before{background:linear-gradient(90deg,var(--dare-2),var(--dare))}
.week li.today{color:var(--ink)}
.week li.today:not(.on)::before{background:transparent;box-shadow:inset 0 0 0 2px var(--dare-2)}
.badges{display:flex;gap:10px;overflow-x:auto;margin:0 calc(var(--gut-r) * -1) 0 calc(var(--gut-l) * -1);padding:0 var(--gut-r) 2px var(--gut-l);scrollbar-width:none}
.badge{display:flex;flex-direction:column;align-items:center;gap:7px;width:78px;flex:none;text-align:center;font-size:11.5px;font-weight:700;line-height:1.25;color:var(--ink-2)}
.medal{position:relative;display:grid;place-items:center;width:58px;height:58px;border-radius:50%;background:linear-gradient(140deg,var(--a),var(--b));color:var(--on-tile);box-shadow:inset 0 0 0 3px rgba(255,255,255,.35)}
.medal .i{width:26px;height:26px}
.badge.off .medal{background:var(--surface-2);color:var(--ink-3);box-shadow:inset 0 0 0 2px var(--surface-3)}
.medal em{position:absolute;bottom:-6px;padding:2px 6px;border-radius:8px;background:var(--ink);color:var(--bg);font:700 9.5px/1.3 var(--f-display);font-style:normal}
.ptabs{display:flex;margin-top:20px;border-bottom:1px solid var(--line)}
.ptab{flex:1;display:flex;justify-content:center;align-items:center;gap:6px;padding:12px 0;font-weight:800;font-size:14px;color:var(--ink-3);position:relative}
.ptab .i{width:20px;height:20px}
.ptab[aria-selected="true"]{color:var(--ink)}
.ptab[aria-selected="true"]::after{content:"";position:absolute;left:24%;right:24%;bottom:-1px;height:3px;border-radius:3px;background:var(--ink)}
.private-note{display:flex;align-items:center;gap:8px;padding:10px var(--gut-r) 10px var(--gut-l);font-size:13px;color:var(--ink-2)}
.private-note .i{width:16px;height:16px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.gtile{position:relative;aspect-ratio:1;max-width:100%;overflow:hidden;background:var(--surface-2)}
.gtile img{width:100%;height:100%;object-fit:cover}
.gtile .tile{position:absolute;left:6px;bottom:6px;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.gtile .glock{position:absolute;right:6px;top:6px;display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.5);color:#fff}
.gtile .glock .i{width:13px;height:13px}

/* ---------- tab bar */
.tabbar{flex:none;display:flex;justify-content:space-around;align-items:center;padding:6px var(--gut-r) 8px var(--gut-l);background:var(--bg);border-top:1px solid var(--line);position:relative;z-index:6}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:58px;padding:4px 0;font-size:10.5px;font-weight:700;color:var(--ink-3)}
.tab .i{width:26px;height:26px}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"] .i{stroke-width:2.4}
.tab-post .plus{display:grid;place-items:center;width:48px;height:34px;border-radius:12px;background:linear-gradient(135deg,var(--dare-2),var(--dare));color:var(--on-dare);box-shadow:0 6px 16px rgba(232,22,79,.35)}
.tab-post .plus .i{stroke-width:2.6}
.tab-post{color:var(--ink-2)}

/* ---------- overlays */
.scrim{position:absolute;inset:0;z-index:30;background:var(--scrim);opacity:0;transition:opacity .28s}
.scrim.open{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:40;max-height:92%;display:flex;flex-direction:column;background:var(--surface);border-radius:26px 26px 0 0;transform:translateY(102%);transition:transform .34s cubic-bezier(.2,.85,.25,1);box-shadow:0 -12px 40px rgba(0,0,0,.18);outline:none}
.sheet.open{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--surface-3);margin:8px auto 2px;flex:none}
.sheet-x{position:absolute;right:8px;top:8px;z-index:2}
.sheet-scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none}
.sheet-body{padding:6px var(--gut-r) 18px var(--gut-l);display:flex;flex-direction:column;gap:14px}
.sheet-cta{flex:none;display:flex;flex-direction:column;gap:8px;padding:12px var(--gut-r) 16px var(--gut-l);border-top:1px solid var(--line)}
.sheet-title{font:700 22px/1.15 var(--f-display);letter-spacing:-.03em;text-wrap:balance;padding-right:36px}
.lede{color:var(--ink-2);font-size:15px;line-height:1.5}
.h3{display:flex;align-items:center;gap:8px;font:700 13px/1.2 var(--f-display);letter-spacing:.02em;text-transform:uppercase;margin-top:6px}
.h3 .i{width:18px;height:18px}
.page{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;background:var(--bg);transform:translateX(102%);transition:transform .34s cubic-bezier(.2,.85,.25,1)}
.page.up{transform:translateY(102%)}
.page.open{transform:none}
.page-bar{flex:none;display:flex;align-items:center;gap:8px;min-height:58px;padding:0 calc(var(--gut-r) - 6px) 0 calc(var(--gut-l) - 8px);border-bottom:1px solid var(--line)}
.pb-who{flex:1;min-width:0;display:flex;align-items:center;gap:10px}
.pb-name{display:flex;flex-direction:column;min-width:0}
.pb-who b{font-weight:800}
.pb-sub{font-size:12.5px;color:var(--safe);font-weight:700;display:flex;align-items:center;gap:4px}
.pb-sub .i{width:13px;height:13px;stroke-width:2.4}
.pb-title{flex:1;font:700 17px/1 var(--f-display);letter-spacing:-.02em}
.page-scroll{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none;padding-bottom:30px}
.toast{position:absolute;left:var(--gut-l);right:var(--gut-r);bottom:84px;z-index:60;display:flex;align-items:center;gap:12px;justify-content:space-between;padding:13px 16px;border-radius:16px;background:var(--ink);color:var(--bg);font-weight:700;font-size:14px;box-shadow:0 12px 30px rgba(0,0,0,.25);transform:translateY(20px);opacity:0;pointer-events:none;transition:transform .25s,opacity .25s}
.toast.show{transform:none;opacity:1;pointer-events:auto}
.toast-undo{color:var(--sticker);font-weight:800}

/* ---------- dare sheet */
.dare-head{position:relative;margin:8px var(--gut-r) 0 var(--gut-l);height:148px;border-radius:22px;background:linear-gradient(140deg,var(--a),var(--b));color:var(--fg,var(--on-tile));overflow:hidden;isolation:isolate}
.dh-icon{position:absolute;right:18px;top:50%;transform:translateY(-50%) rotate(-8deg);display:grid;place-items:center;width:92px;height:92px;border-radius:28px;background:rgba(255,255,255,.2)}
.dh-icon .i{width:50px;height:50px;stroke-width:1.8}
.dh-rank{position:absolute;left:16px;top:16px;display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.24);font-weight:800;font-size:12.5px}
.dh-rank .i{width:15px;height:15px}
.dh-count{position:absolute;left:16px;bottom:14px;font:700 30px/1 var(--f-display);letter-spacing:-.04em}
.dh-count small{display:block;font:700 12px/1.4 var(--f-body);letter-spacing:0;opacity:.85}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.fact{display:flex;flex-direction:column;gap:5px;padding:10px;border-radius:14px;background:var(--surface-2);min-width:0}
.fact-k{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.fact-v{font-weight:800;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.steps{list-style:none;counter-reset:st;display:flex;flex-direction:column;gap:10px}
.steps li{counter-increment:st;display:flex;gap:12px;line-height:1.45;font-size:14.5px}
.steps li::before{content:counter(st);flex:none;display:grid;place-items:center;width:24px;height:24px;border-radius:8px;background:var(--ink);color:var(--surface);font:700 11px/1 var(--f-display)}
.rules-card{padding:14px;border-radius:18px;background:var(--safe-soft);display:flex;flex-direction:column;gap:10px}
.rules-card .h3{color:var(--safe);margin-top:0}
.rules{list-style:none;display:flex;flex-direction:column;gap:8px}
.rules li{display:flex;gap:10px;font-size:14px;line-height:1.45;color:var(--ink)}
.rules li .i{width:18px;height:18px;color:var(--safe);stroke-width:2.6;margin-top:1px}
.proof{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.proof-tile{aspect-ratio:1;max-width:100%;border-radius:12px;overflow:hidden;background:var(--surface-2)}
.proof-tile img{width:100%;height:100%;object-fit:cover}

/* ---------- matching */
.split2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ps{padding:13px;border-radius:16px;background:var(--surface-2);display:flex;flex-direction:column;gap:8px;min-width:0}
.ps h4{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.ps h4 .i{width:16px;height:16px}
.ps.yes h4{color:var(--safe)}
.ps.no h4{color:var(--dare-fg)}
.ps ul{list-style:none;display:flex;flex-direction:column;gap:6px;font-size:13.5px;line-height:1.3}
.set-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.set-row:last-child{border-bottom:0}
.set-ico{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:var(--safe-soft);color:var(--safe);flex:none}
.set-ico .i{width:20px;height:20px}
.set-ico.off{background:var(--dare-soft);color:var(--dare-fg)}
.set-text{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.set-t{font-weight:800;font-size:14.5px}
.set-d{font-size:13px;line-height:1.35;color:var(--ink-2)}
.locked{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:800;color:var(--safe);white-space:nowrap}
.locked .i{width:14px;height:14px;stroke-width:2.4}
.switch{position:relative;width:48px;height:29px;border-radius:15px;background:var(--surface-3);flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:23px;height:23px;border-radius:50%;background:var(--knob);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.switch[aria-checked="true"]{background:var(--safe)}
.switch[aria-checked="true"]::after{transform:translateX(19px)}
.radar{position:relative;display:grid;place-items:center;height:220px;margin-top:6px}
.radar span{position:absolute;width:90px;height:90px;border-radius:50%;border:2px solid var(--dare-2);opacity:0;animation:ping 2.4s cubic-bezier(.2,.6,.4,1) infinite}
.radar span:nth-child(2){animation-delay:.8s}
.radar span:nth-child(3){animation-delay:1.6s}
@keyframes ping{0%{transform:scale(.6);opacity:.9}100%{transform:scale(2.4);opacity:0}}
.radar .av{position:relative;z-index:1}
.radar-q{position:absolute;display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--surface-2);color:var(--ink-3);font:700 14px/1 var(--f-display);animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}
.center{text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.match-card{display:flex;flex-direction:column;align-items:center;gap:10px;padding:22px 16px 18px;border-radius:24px;background:var(--surface-2);text-align:center}
.match-name{font:700 26px/1 var(--f-display);letter-spacing:-.03em}
.match-meta{font-size:14px;color:var(--ink-2)}
.pill-safe{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:var(--safe-soft);color:var(--safe);font-weight:800;font-size:12.5px}
.pill-safe .i{width:15px;height:15px;stroke-width:2.4}
.tags{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.tag{padding:6px 11px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:13px;font-weight:700}

/* ---------- chat page */
.pin{flex:none;display:flex;align-items:center;gap:10px;padding:10px var(--gut-r) 10px var(--gut-l);background:var(--surface);border-bottom:1px solid var(--line)}
.pin-text{flex:1;min-width:0;display:flex;flex-direction:column}
.pin-text b{font-weight:800;font-size:14px}
.pin-text span{font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.msgs{flex:1;min-height:0;overflow-y:auto;padding:14px var(--gut-r) 14px var(--gut-l);display:flex;flex-direction:column;gap:6px;scrollbar-width:none}
.msg{max-width:80%;padding:9px 13px;border-radius:20px;font-size:15px;line-height:1.35;overflow-wrap:anywhere;animation:rise .25s ease}
@keyframes rise{from{opacity:0;transform:translateY(6px)}}
.msg.me{align-self:flex-end;background:var(--dare);color:var(--on-dare);border-bottom-right-radius:6px}
.msg.them{align-self:flex-start;background:var(--surface-2);border-bottom-left-radius:6px}
.msg.sys{align-self:center;max-width:94%;display:flex;gap:8px;align-items:flex-start;margin:6px 0;padding:9px 12px;border-radius:14px;background:var(--safe-soft);color:var(--ink-2);font-size:12.5px;line-height:1.45}
.msg.sys .i{width:16px;height:16px;color:var(--safe);margin-top:1px}
.msg.img{padding:4px}
.msg.img img{width:200px;max-width:100%;border-radius:16px}
.masked{display:inline-flex;align-items:center;gap:3px;padding:0 6px;border-radius:6px;background:rgba(0,0,0,.2);font-size:13px;font-weight:700;vertical-align:1px}
.masked .i{width:13px;height:13px}
.typing{display:flex;gap:4px;padding:13px 14px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--ink-3);animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,60%,100%{opacity:.3;transform:none}30%{opacity:1;transform:translateY(-3px)}}
.chat-form{flex:none;display:flex;gap:8px;align-items:center;padding:10px var(--gut-r) 4px var(--gut-l)}
.chat-form input{flex:1;min-width:0;height:46px;padding:0 16px;border-radius:23px;border:1.5px solid var(--line);background:var(--surface);outline:none}
.chat-form input:focus{border-color:var(--ink-3)}
.send{display:grid;place-items:center;width:46px;height:46px;border-radius:50%;background:var(--dare);color:var(--on-dare);flex:none}
.send .i{width:21px;height:21px;stroke-width:2.2}
.chat-foot{flex:none;display:flex;align-items:center;justify-content:center;gap:6px;padding:4px var(--gut-r) 10px var(--gut-l);font-size:12px;color:var(--ink-3)}
.chat-foot .i{width:14px;height:14px}
.chat-closed{flex:none;display:flex;align-items:center;justify-content:center;gap:8px;padding:16px var(--gut-r) 18px var(--gut-l);font-size:13.5px;font-weight:700;color:var(--ink-2);border-top:1px solid var(--line)}
.chat-closed .i{width:16px;height:16px}

/* ---------- composer */
.c-sec{padding:16px var(--gut-r) 0 var(--gut-l)}
.c-label{display:block;font-size:12px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin-bottom:8px}
.select-wrap{position:relative;display:flex;align-items:center;gap:10px;padding:8px 12px 8px 8px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.select-wrap select{flex:1;min-width:0;appearance:none;-webkit-appearance:none;border:0;background:transparent;font-weight:800;font-size:15px;padding:8px 24px 8px 0;outline:none;cursor:pointer}
.select-wrap>.i{position:absolute;right:12px;pointer-events:none;width:18px;height:18px;color:var(--ink-3)}

const modeChip = d => d.mode === 'pair' ? html`<span class="mode">${ic('users')}Stranger</span>` : html`<span class="mode">${ic('user')}Solo</span>`;
function trend(d) {
  const t = d.tr[S.period];
  if (t === 'new') return html`<span class="trend new">New</span>`;
  if (t > 0) return html`<span class="trend up">${ic('up')}${t}<span class="sr"> places up</span></span>`;
  if (t < 0) return html`<span class="trend down">${ic('down')}${-t}<span class="sr"> places down</span></span>`;
  return html`<span class="trend" aria-label="No change">–</span>`;
}
const PERIOD = { today: 'today', week: 'this week', all: 'all time' };
function timeLeft() { const n = new Date(), m = new Date(n); m.setHours(24, 0, 0, 0); const mins = Math.max(0, Math.round((m - n) / 60000)), h = Math.floor(mins / 60), mm = mins % 60; return h ? `${h}h ${mm}m left` : `${mm}m left`; }
const visible = p => !p.hidden && !S.blocked.has(p.user);
const rankOf = (id, period) => DARES.slice().sort((a, b) => b.n[period] - a.n[period]).findIndex(d => d.id === id) + 1;

const RENDER = { home: renderHome, dares: renderDares, chats: renderChats, profile: renderProfile };
const VIEWS = Object.keys(RENDER);
function go(v, fromHash) {
  if (!VIEWS.includes(v)) v = 'home';
  const same = S.view === v && !fromHash;
  S.view = v;
  VIEWS.forEach(n => { $('#v-' + n).hidden = n !== v; });
  $$('.tab[data-go]').forEach(t => t.dataset.go === v ? t.setAttribute('aria-current', 'page') : t.removeAttribute('aria-current'));
  RENDER[v]();
  if (same) $('#v-' + v).scrollTo({ top: 0, behavior: 'smooth' });
  if (!fromHash && location.hash.slice(1) !== v) { try { location.hash = v; } catch (e) { /* hash routing is optional */ } }
}
function refresh() { RENDER[S.view](); }

let lastFocus = null, sheetT = null, pageT = null;
function openSheet(kind, params = {}) {
  if (sheet.hidden || !sheet.classList.contains('open')) lastFocus = document.activeElement;
  S.sheet = { kind, params }; renderSheet();
  clearTimeout(sheetT); scrim.hidden = false; sheet.hidden = false;
  requestAnimationFrame(() => requestAnimationFrame(() => { scrim.classList.add('open'); sheet.classList.add('open'); }));
  sheet.focus({ preventScroll: true });
}
function renderSheet(keep) {
  if (!S.sheet) return;
  const r = SHEETS[S.sheet.kind](S.sheet.params), sc = $('#sheet-scroll'), st = keep ? sc.scrollTop : 0;
  put(sc, r.body); const cta = $('#sheet-cta'); put(cta, r.cta || html``); cta.hidden = !r.cta;
  sheet.setAttribute('aria-label', r.label); hydrate(sc); sc.scrollTop = st;
}
function closeSheet() {
  if (sheet.hidden) return;
  clearTimeout(S.matchT); scrim.classList.remove('open'); sheet.classList.remove('open');
  sheetT = setTimeout(() => { sheet.hidden = true; scrim.hidden = true; S.sheet = null; }, 340);
  if (lastFocus && document.contains(lastFocus)) lastFocus.focus({ preventScroll: true });
}
function openPage(kind) {
  S.page = kind; clearTimeout(pageT); page.hidden = false;
  requestAnimationFrame(() => requestAnimationFrame(() => page.classList.add('open')));
}
function closePage() {
  if (page.hidden) return;
  page.classList.remove('open'); const was = S.page; S.page = null; S.openChat = null;
  pageT = setTimeout(() => { page.hidden = true; page.innerHTML = ''; }, 340);
  if (was === 'chat' && S.view === 'chats') renderChats();
}
function confirmSheet(o) { S.confirmFn = o.onOk; S.confirmBack = o.back || null; openSheet('confirm', o); }

      <div class="c-sec"><span class="c-label" id="aud-l">Who can see it</span><div class="seg" role="group" aria-labelledby="aud-l" id="c-aud"></div><p class="c-hint" id="aud-hint"></p></div>
      <div class="c-sec" id="c-partner"></div>
    </div>`);
  renderCompPhoto(); renderCompChecks(); renderCompAud(); renderCompPartner(); updatePostBtn();
}
function renderCompPhoto() {
  const c = S.comp, el = $('#c-photo'); if (!el) return;
  if (c.busy) { put(el, html`<div class="busy"><span class="spin"></span>Cleaning your photo…</div>`); return; }
  if (c.canvas) { put(el, html`<div class="photo-prev"><img id="c-prev" alt="Preview of your post"><button class="btn sm" data-act="pick-photo">${ic('image')}Change</button></div>`); $('#c-prev').src = jpg(finalCanvas(), .8); return; }
  put(el, html`<div class="photo-empty"><span class="big">${ic('camera')}</span><b>Add your proof</b><p>Point it at the moment, not at people.</p>
    ${c.error ? html`<p class="err" role="alert">${c.error}</p>` : ''}
    <div class="photo-btns"><button class="btn primary sm" id="c-pick" data-act="pick-photo">${ic('image')}Choose a photo</button><button class="btn ghost sm" data-act="sample-photo">Use a sample</button></div>
    <p class="muted">JPEG, PNG or WebP, up to 15 MB.</p></div>`);
}
function renderCompChecks() {
  const c = S.comp, el = $('#c-checks'); if (!el) return;
  const items = ['Location data removed', 'Camera and device details removed', 'Resized to 1080 px'];
  put(el, html`<div class="checks"><h3 class="h3">${ic('shieldCheck')}Safety check</h3>
    <ul>${items.map((t, i) => html`<li class="${c.checks > i ? 'ok' : ''}"><span class="ck">${c.checks > i ? ic('check') : ''}</span>${t}</li>`)}</ul>
    ${c.canvas ? '' : html`<small>These happen automatically when you add a photo.</small>`}
    <label class="confirm"><input type="checkbox" id="c-confirm"${c.confirmed ? raw(' checked') : ''}><span>No one else’s face, name, school, address or license plate shows without their OK.</span></label></div>`);
}
function renderCompAud() {
  const c = S.comp, el = $('#c-aud'); if (!el) return;
  put(el, html`${[['everyone', 'Everyone'], ['followers', 'Followers'], ['me', 'Only me']].map(([k, l]) => html`<button type="button" data-act="aud" data-v="${k}" aria-pressed="${bool(c.audience === k)}">${l}</button>`)}`);
  $('#aud-hint').textContent = { everyone: 'Anyone on Dareme can see it, and it counts toward the dare board.', followers: 'Only followers you’ve approved can see it.', me: 'Only you can see it. It still counts for your streak.' }[c.audience];
}
function renderCompPartner() {
  const c = S.comp, el = $('#c-partner'); if (!el) return;
  if (!compPair()) { el.hidden = true; el.innerHTML = ''; return; }
  el.hidden = false;
  put(el, html`<span class="c-label">Your dare partner</span><div class="partner">
    <div class="partner-top">${av('noa', 40)}<span class="pt-text"><b>Noa</b><small>ID verified stranger</small></span></div>
    ${S.partnerPhoto ? html`<div class="row"><span id="pp-l">Add Noa’s photo beside yours</span><button class="switch" role="switch" aria-labelledby="pp-l" aria-checked="${bool(c.partner)}" data-act="partner-photo"></button></div>` : html`<p class="muted">Noa hasn’t sent a photo yet. Say hi in the chat first.</p>`}
    <div><span class="c-label" id="cr-l" style="margin-bottom:6px">Credit them as</span><div class="seg" role="group" aria-labelledby="cr-l">
      <button type="button" data-act="credit" data-v="stranger" aria-pressed="${bool(c.credit === 'stranger')}">A stranger</button>
      <button type="button" data-act="credit" data-v="name" aria-pressed="${bool(c.credit === 'name')}"${S.creditOk ? '' : raw(' disabled')}>Noa</button></div>
      ${S.creditOk ? html`<p class="c-hint">Noa said yes to first-name credit.</p>` : S.creditAsked ? html`<p class="c-hint">Asked. Waiting for Noa…</p>` : html`<p class="c-hint">Noa has to agree first. <button class="link" data-act="ask-credit">Ask Noa</button></p>`}</div>
  </div>`);
}
function finalCanvas() {
  const c = S.comp;
  if (compPair() && S.partnerPhoto && c.partner) return split(c.canvas, CANV.noaSky, U.me.first.toLowerCase(), c.credit === 'name' ? 'noa' : 'a stranger');
  return c.canvas;
}
function captionError() {
  const v = ($('#c-caption') || {}).value || '', f = scrub(v).found;
  return f.length ? `Captions are public. Remove the ${listWords(f)} to post.` : '';
}
function updatePostBtn() {
  const c = S.comp, b = $('#post-btn'); if (!b) return;
  const err = captionError(); const e = $('#c-cap-err'); if (e) e.textContent = err;
  b.disabled = !(c.canvas && c.confirmed && !err && !c.busy);
}
async function handleFile(file) {
  const c = S.comp; if (!c || !file) return;
  c.error = '';
  if (!['image/jpeg', 'image/png', 'image/webp'].includes(file.type)) { c.error = 'That file type isn’t supported. Use a JPEG, PNG or WebP photo.'; renderCompPhoto(); return; }
  if (file.size > MAX_BYTES) { c.error = 'That photo is over 15 MB. Pick a smaller one.'; renderCompPhoto(); return; }
  c.busy = true; c.canvas = null; c.checks = 0; renderCompPhoto(); renderCompChecks(); updatePostBtn();
  try {
    if (!(await sniff(file))) throw new Error('That file isn’t really a photo. Use a JPEG, PNG or WebP.');
    const img = await loadImg(await readURL(file));
    if (img.naturalWidth < 200 || img.naturalHeight < 200) throw new Error('That photo is too small. Use one at least 200 px wide.');
    setPhoto(reencode(img));
  } catch (e) {
    c.busy = false; c.error = e.message && e.message.length > 12 ? e.message : 'We couldn’t read that photo. Try another one.'; renderCompPhoto(); renderCompChecks(); updatePostBtn();
  }
}
function setPhoto(canvas) {
  const c = S.comp; c.canvas = canvas; c.busy = false; c.error = ''; c.checks = 0;
  renderCompPhoto(); renderCompChecks(); updatePostBtn();
  [1, 2, 3].forEach(n => setTimeout(() => { if (S.comp === c) { c.checks = n; renderCompChecks(); updatePostBtn(); } }, 180 * n));
}
function submitPost() {
  const c = S.comp; if (!c || !c.canvas || !c.confirmed || captionError()) return;
  const cap = $('#c-caption').value.trim().slice(0, 220), d = D[c.dare], pair = compPair();
  const fin = finalCanvas(), key = 'u' + uid(); IMG[key] = jpg(fin, .86);
  S.posts.unshift({ id: key, user: 'me', dare: c.dare, img: key, aspect: +(fin.width / fin.height).toFixed(3), alt: `Your photo for ${d.title}`, caption: cap, likes: 0, liked: false, saved: false, comments: [], commentCount: 0, time: 'Just now', with: pair ? (c.credit === 'name' ? 'Noa' : 'a stranger') : '', audience: c.audience });
  d.n.today++; d.n.week++; d.n.all++;
  if (S.active && S.active.dare === c.dare) {
    if (S.active.mode === 'pair') { const ch = chat('noa'); if (ch) { ch.status = 'done'; ch.msgs.push({ from: 'sys', icon: 'check', text: `Dare finished. You both earned ${d.pts} points.` }); } }
    S.active = null;
  }
  S.me.points += d.pts; S.me.dares++;
  if (!S.me.postedToday) { S.me.postedToday = true; S.me.streak++; }
  S.notifs.unshift({ id: 'n' + uid(), icon: 'trophy', tone: 'gold', text: `Your ${d.title} post is live. ${d.n.week.toLocaleString('en-US')} people have done it this week.`, time: 'now' });
  closePage(); S.feedTab = 'foryou'; go('home'); $('#v-home').scrollTop = 0;
  toast(`Posted${{ everyone: '', followers: ' to followers', me: ' just for you' }[c.audience]}. +${d.pts} points, ${S.me.streak}-day streak.`);
  S.comp = null;
}
function askCredit() {
  S.creditAsked = true; renderCompPartner();
  const c = chat('noa'); if (!c) return;
  c.msgs.push({ from: 'sys', icon: 'user', text: 'You asked Noa if you can credit them by first name.' });
  setTimeout(() => { S.creditOk = true; c.msgs.push({ from: 'them', parts: T('yes! first name is fine') }); if (S.page === 'compose') renderCompPartner(); toast('Noa said yes to first-name credit.'); }, 1600);
}

/* =========================================================
   Feed actions
   ========================================================= */
function toggleLike(id, onlyOn) {
  const p = P(id); if (!p) return;
  if (onlyOn && p.liked) return;
  p.liked = !p.liked; p.likes += p.liked ? 1 : -1;
  $$(`.post[data-post="${id}"] .like`).forEach(b => { b.classList.toggle('on', p.liked); b.setAttribute('aria-pressed', bool(p.liked)); b.querySelector('.n').textContent = fmt(p.likes); });
}
function toggleSave(id) {
  const p = P(id); p.saved = !p.saved;
  $$(`.post[data-post="${id}"] .save`).forEach(b => { b.classList.toggle('on', p.saved); b.setAttribute('aria-pressed', bool(p.saved)); });
  toast(p.saved ? 'Saved. Only you can see your saved posts.' : 'Removed from saved.');
}
let lastTap = {};
function mediaTap(id, el) {
  const now = Date.now();
  if (lastTap.id === id && now - lastTap.t < 320) {
    toggleLike(id, true); const b = el.querySelector('.burst'); b.classList.remove('go'); void b.offsetWidth; b.classList.add('go'); lastTap = {};
  } else lastTap = { id, t: now };
}
function hidePost(id) {
  const p = P(id); p.hidden = true; closeSheet(); refresh();
  toast('Post hidden.', () => { p.hidden = false; refresh(); });
}
function doBlock(id) {
  S.blocked.add(id); S.following.delete(id);
  S.chats.forEach(c => { if (c.user === id && c.status === 'active') { c.status = 'blocked'; if (S.active && S.active.mode === 'pair') S.active = null; } });
  closeSheet(); if (S.page === 'chat') closePage(); refresh();
  toast(`Blocked ${U[id].handle || U[id].name}. They can’t see your profile or contact you.`);
}
function toast(msg, undo) {
  const t = $('#toast'); put(t, html`<span>${msg}</span>${undo ? html`<button class="toast-undo" data-act="undo">Undo</button>` : ''}`);
  S.undo = undo || null; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), undo ? 5000 : 2800);
}

/* =========================================================
   Events
   ========================================================= */
const ACT = {
  dare: d => openSheet('dare', { id: d.dare }),
  'accept-solo': d => { closeSheet(); startDare(d.dare, 'solo'); },
  'find-stranger': d => { S.match = { dare: d.dare, step: 'intro', tries: 0 }; openSheet('match'); },
  'match-start': () => { if (S.match.step === 'none') S.match.tries = 1; runSearch(); },
  'match-cancel': () => { clearTimeout(S.matchT); S.match.step = 'intro'; renderSheet(); },
  'match-skip': () => { S.match.tries++; runSearch(); },
  'match-accept': acceptMatch,
  'match-solo': () => { const id = S.match.dare; closeSheet(); startDare(id, 'solo'); },
  compose: d => openComposer(d.dare),
  'give-up': d => confirmSheet({ title: `Give up on ${D[d.dare].title}?`, body: 'No points lost. Pick another dare before midnight to keep your streak.', ok: 'Give up', danger: true, onOk: () => { if (S.active && S.active.mode === 'pair') { const c = chat('noa'); if (c) c.status = 'ended'; } S.active = null; closeSheet(); refresh(); toast('Dare dropped. Your streak is safe until midnight.'); } }),
  like: d => toggleLike(d.post),
  media: (d, el) => mediaTap(d.post, el),
  save: d => toggleSave(d.post),
  comments: d => openSheet('comments', { id: d.post }),
  'post-menu': d => openSheet('menu', { id: d.post }),
  'open-post': d => openSheet('post', { id: d.post }),
  'delete-post': d => confirmSheet({ title: 'Delete this post?', body: 'It’s removed from your profile and the dare board. This can’t be undone.', ok: 'Delete', danger: true, onOk: () => { S.posts = S.posts.filter(p => p.id !== d.post); closeSheet(); refresh(); toast('Post deleted.'); } }),
  report: d => { S.reportTarget = { kind: d.kind, id: d.id }; openSheet('report', { kind: d.kind, id: d.id }); },
  'report-send': () => { const t = S.reportTarget, user = t.kind === 'post' ? P(t.id).user : t.id; S.reports++; openSheet('reported', { ref: 'DR-' + (10000 + rand32() % 90000), user }); },
  hide: d => hidePost(d.post),
  block: d => { const u = U[d.user]; confirmSheet({ title: `Block ${u.handle || u.name}?`, body: 'They won’t be able to see your profile, find your posts or message you. They aren’t told you blocked them.', ok: 'Block', danger: true, onOk: () => doBlock(d.user) }); },
  unblock: d => { S.blocked.delete(d.user); renderSheet(true); refresh(); toast(`Unblocked ${U[d.user].handle || U[d.user].name}.`); },
  safety: () => openSheet('safety'),
  notifs: () => { openSheet('notifs'); S.notifs.forEach(n => { n.unread = false; }); S.unread = 0; if (S.view === 'home') renderHome(); },
  req: d => { const n = S.notifs.find(x => x.id === d.id); n.state = d.ans; if (d.ans === 'yes') S.me.followers++; renderSheet(true); },
  'close-sheet': closeSheet,
  'confirm-ok': () => { const f = S.confirmFn; S.confirmFn = null; if (f) f(); },
  'confirm-cancel': () => { const b = S.confirmBack; S.confirmFn = null; if (b === 'safety') openSheet('safety'); else if (b === 'match') openSheet('match'); else closeSheet(); },
  'feed-tab': d => { S.feedTab = d.tab; renderHome(); },
  period: d => { S.period = d.p; renderDares(); },
  filter: d => { S.filter = d.f; renderDares(); },
  'chat-open': d => openChat(d.chat),
  'page-close': closePage,
  'chat-safety': () => openSheet('chatSafety'),
  'chat-leave': () => { const c = chat(S.openChat); confirmSheet({ title: 'Leave this dare?', body: `The chat closes for you and ${U[c.user].name}. Nobody loses points, and you can find someone new any time.`, ok: 'Leave dare', danger: true, onOk: () => { c.status = 'ended'; c.msgs.push({ from: 'sys', icon: 'leave', text: 'You left the dare. No points lost.' }); if (S.active && S.active.mode === 'pair') S.active = null; closeSheet(); renderChat(); toast('You left the dare.'); } }); },
  'chat-block': () => { const c = chat(S.openChat); ACT.block({ user: c.user }); },
  setting: d => toggleSetting(d.key, d.back),
  'profile-tab': d => { S.profileTab = d.tab; renderProfile(); },
  peek: d => { if (d.user === 'me') { closeSheet(); go('profile'); } else openSheet('peek', { id: d.user }); },
  follow: d => { S.following.has(d.user) ? S.following.delete(d.user) : S.following.add(d.user); renderSheet(true); if (S.view === 'home') renderHome(); },
  'edit-profile': () => toast('Profile editing comes in the next design pass.'),
  suggest: () => openSheet('suggest', {}),
  'suggest-send': () => openSheet('suggest', { sent: true }),
  'pick-photo': () => $('#file-in').click(),
  'sample-photo': () => { S.comp.busy = true; renderCompPhoto(); setTimeout(() => setPhoto(reencode(sky(SKY.day, 1 + rand32() % 999))), 350); },
  aud: d => { S.comp.audience = d.v; renderCompAud(); },
  credit: d => { if (d.v === 'name' && !S.creditOk) return; S.comp.credit = d.v; renderCompPartner(); if (S.comp.canvas) renderCompPhoto(); },
  'ask-credit': askCredit,
  'partner-photo': () => { S.comp.partner = !S.comp.partner; renderCompPartner(); if (S.comp.canvas) renderCompPhoto(); },
  'submit-post': submitPost,
  undo: () => { const u = S.undo; S.undo = null; $('#toast').classList.remove('show'); if (u) u(); },
};
function toggleSetting(k, back) {
  const s = S.settings, reopen = () => openSheet(back === 'match' ? 'match' : 'safety');
  if (k === 'private' && s.private) return confirmSheet({ title: 'Make your account public?', body: 'Anyone on Dareme could see your posts, your followers and who you follow. Strangers from dares still only see your first name.', ok: 'Make it public', danger: true, back, onOk: () => { s.private = false; reopen(); refresh(); toast('Your account is public.'); } });
  if (k === 'verifiedOnly' && s.verifiedOnly) return confirmSheet({ title: 'Match with unverified people?', body: 'They haven’t confirmed their age or identity. We strongly recommend keeping this on.', ok: 'Turn it off anyway', danger: true, back, onOk: () => { s.verifiedOnly = false; reopen(); } });
  s[k] = !s[k]; renderSheet(true); refresh();
}

app.addEventListener('click', e => {
  const b = e.target.closest('[data-act],[data-go]'); if (!b || !app.contains(b) || b.disabled) return;
  if (b.dataset.go) { closeSheet(); go(b.dataset.go); return; }
  const fn = ACT[b.dataset.act]; if (fn) { e.preventDefault(); fn(b.dataset, b, e); }
});
scrim.addEventListener('click', closeSheet);
app.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'chat-form') { const i = $('#chat-input'); sendChat(i.value); i.value = ''; i.focus(); }
  if (e.target.id === 'comment-form') {
    const i = $('#comment-input'), t = i.value.trim().slice(0, 300); if (!t) return;
    const p = P(e.target.dataset.post), sc = scrub(t);
    p.comments.push({ u: 'me', parts: sc.parts, time: 'now' }); p.commentCount++; i.value = '';
    renderSheet(true); $('#sheet-scroll').scrollTop = 1e6;
    if (sc.found.length) toast(`We hid the ${listWords(sc.found)}. Comments are public.`);
    $$(`.post[data-post="${p.id}"] [data-act="comments"] span`).forEach(s => { s.textContent = fmt(p.commentCount); });
  }
});
app.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'file-in') { const f = t.files && t.files[0]; t.value = ''; handleFile(f); }
  if (t.id === 'c-confirm') { S.comp.confirmed = t.checked; updatePostBtn(); }
  if (t.id === 'c-dare') { S.comp.dare = t.value; put($('#c-dare-tile'), tile(D[t.value], 38)); renderCompPartner(); if (S.comp.canvas) renderCompPhoto(); }
  if (t.name === 'reason') { const b = $('#report-send'); if (b) b.disabled = false; }
  if (t.id === 'sug-ok') { const b = $('#sug-send'); if (b) b.disabled = !(t.checked && $('#sug-text').value.trim().length > 8); }
});
app.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'c-caption') { $('#c-count').textContent = `${t.value.length}/220`; updatePostBtn(); }
  if (t.id === 'sug-text') { const b = $('#sug-send'), ok = $('#sug-ok'); if (b) b.disabled = !(ok.checked && t.value.trim().length > 8); }
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (!sheet.hidden && sheet.classList.contains('open')) closeSheet(); else if (!page.hidden) closePage();
});
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (VIEWS.includes(h) && h !== S.view) go(h, true); });
setInterval(() => $$('[data-countdown]').forEach(el => { el.textContent = timeLeft(); }), 30000);

/* =========================================================
   Boot
   ========================================================= */
function renderChrome() {
  const tabs = { home: ['home', 'Home'], dares: ['flame', 'Dares'], chats: ['chat', 'Chats'], profile: ['user', 'You'] };
  $$('.tab[data-go]').forEach(t => { const [i, l] = tabs[t.dataset.go]; put(t, html`${ic(i)}<span>${l}</span>`); });
  put($('.tab-post'), html`<span class="plus">${ic('plus')}</span><span>Post</span>`);
  put($('.sheet-x'), ic('x'));
  put($('#brief'), html`
    <div><p class="eyebrow">Clickable prototype</p><h1 class="brief-title">dare<span>me</span></h1>
    <p class="brief-lede">Dare a stranger, or dare yourself. Finish it, post the proof, climb the board.</p></div>
    <div><h2>Try it</h2><ol class="brief-steps">
      <li><span>Tap <b>Same sky</b> in the top row, then find a stranger.</span></li>
      <li><span>Say hi to Noa. Try sending a phone number.</span></li>
      <li><span>Post your proof with Noa’s photo beside yours.</span></li>
    </ol></div>
    <div><h2>Safety, built in</h2><ul class="brief-safe">
      <li>${ic('id')}Verified, age-banded matching</li>
      <li>${ic('user')}Strangers see your first name only</li>
      <li>${ic('eyeOff')}Numbers, emails and links hidden</li>
      <li>${ic('pinOff')}Photo location data stripped</li>
      <li>${ic('shieldCheck')}Every dare reviewed before it’s live</li>
      <li>${ic('flag')}Report, block or leave in one tap</li>
    </ul></div>`);
}

buildImages();
renderChrome();
go(VIEWS.includes(location.hash.slice(1)) ? location.hash.slice(1) : 'home', true);
if (document.fonts && document.fonts.load) {
  Promise.race([
    Promise.all(['700 40px Unbounded', '800 40px Unbounded', '700 30px Figtree', '500 30px Figtree', '600 40px Caveat'].map(f => document.fonts.load(f))),
    new Promise(r => setTimeout(r, 2500)),
  ]).then(() => { buildImages(); hydrate(document, true); }).catch(() => {});
}
})();
</script>
